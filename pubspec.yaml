name: scrcpy_flutter_plugin
description: >-
  A Flutter FFI plugin that embeds scrcpy into your app, enabling real-time
  Android screen mirroring and control via ADB on macOS, Windows and Linux.
version: 0.1.1
homepage: https://github.com/scrcpy-flutter/scrcpy_flutter_plugin
repository: https://github.com/scrcpy-flutter/scrcpy_flutter_plugin
issue_tracker: https://github.com/scrcpy-flutter/scrcpy_flutter_plugin/issues

environment:
  sdk: ^3.12.2
  flutter: '>=3.3.0'

dependencies:
  ffi: ^2.2.0
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  ffigen: ^20.1.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      linux:
        ffiPlugin: true
      macos:
        pluginClass: ScrcpyFlutterPlugin
        ffiPlugin: true
      windows:
        pluginClass: ScrcpyFlutterPlugin
        ffiPlugin: true

  assets:
    - assets/

  #
  # For details regarding assets in packages, see
  # https://flutter.dev/to/asset-from-package
  #
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # To add custom fonts to your plugin package, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts in packages, see
  # https://flutter.dev/to/font-from-package
